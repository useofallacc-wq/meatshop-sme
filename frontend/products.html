<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products · Cuts & Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">Cuts&nbsp;&amp;&nbsp;Co. <span>MEAT SHOP</span></div>
    <nav class="nav-group">
      <a class="nav-link" href="index.html">🏠 Dashboard</a>
      <a class="nav-link" href="products.html">🥩 Products</a>
      <a class="nav-link" href="inventory.html">📦 Inventory</a>
      <a class="nav-link" href="orders.html">🧾 Orders</a>
      <a class="nav-link" href="customers.html">👤 Customers</a>
      <a class="nav-link" href="settings.html">⚙️ Categories / Suppliers / Staff</a>
    </nav>
    <div class="sidebar-foot">Connected to Supabase.<br>Backend: Flask REST API.</div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Products</h1>
        <p>Manage the cuts and items you sell.</p>
      </div>
      <button class="btn btn-primary" onclick="openProductModal()">+ Add product</button>
    </div>

    <div class="toolbar">
      <input class="input search-input" id="search-input" placeholder="Search products…" oninput="debouncedLoad()">
      <select class="input" id="category-filter" onchange="loadProducts()">
        <option value="">All categories</option>
      </select>
    </div>

    <div class="panel">
      <div class="panel-body">
        <table>
          <thead>
            <tr><th>Product</th><th>Category</th><th>Unit</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="product-rows"><tr><td colspan="7" class="cell-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit Product Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal">
    <h2 id="product-modal-title">Add product</h2>
    <form id="product-form">
      <input type="hidden" id="product-id">
      <div class="form-grid">
        <div class="field full">
          <label>Product name</label>
          <input class="input" id="f-name" required>
        </div>
        <div class="field">
          <label>Category</label>
          <select class="input" id="f-category"></select>
        </div>
        <div class="field">
          <label>Supplier</label>
          <select class="input" id="f-supplier"></select>
        </div>
        <div class="field">
          <label>Unit</label>
          <select class="input" id="f-unit">
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="pc">pc</option>
            <option value="pack">pack</option>
            <option value="tray">tray</option>
          </select>
        </div>
        <div class="field">
          <label>SKU (optional)</label>
          <input class="input" id="f-sku">
        </div>
        <div class="field">
          <label>Selling price (₱)</label>
          <input class="input" type="number" step="0.01" id="f-price" required>
        </div>
        <div class="field">
          <label>Cost price (₱)</label>
          <input class="input" type="number" step="0.01" id="f-cost">
        </div>
        <div class="field">
          <label>Starting stock</label>
          <input class="input" type="number" step="0.01" id="f-stock">
        </div>
        <div class="field">
          <label>Reorder level</label>
          <input class="input" type="number" step="0.01" id="f-reorder" value="5">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('product-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save product</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
</body>
</html>
