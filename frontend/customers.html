<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers · Cuts & Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">Cuts&nbsp;&amp;&nbsp;Co. <span>MEAT SHOP</span></div>
    <nav class="nav-group">
      <a class="nav-link" href="index.html">🏠 Dashboard</a>
      <a class="nav-link" href="products.html">🥩 Products</a>
      <a class="nav-link" href="inventory.html">📦 Inventory</a>
      <a class="nav-link" href="orders.html">🧾 Orders</a>
      <a class="nav-link" href="customers.html">👤 Customers</a>
      <a class="nav-link" href="settings.html">⚙️ Categories / Suppliers / Staff</a>
    </nav>
    <div class="sidebar-foot">Connected to Supabase.<br>Backend: Flask REST API.</div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Customers</h1>
        <p>Keep a record of regulars and their contact details.</p>
      </div>
      <button class="btn btn-primary" onclick="openCustomerModal()">+ Add customer</button>
    </div>

    <div class="toolbar">
      <input class="input search-input" id="search-input" placeholder="Search customers…" oninput="debouncedLoad()">
    </div>

    <div class="panel">
      <div class="panel-body">
        <table>
          <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th></th></tr></thead>
          <tbody id="customer-rows"><tr><td colspan="5" class="cell-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="customer-modal">
  <div class="modal">
    <h2 id="customer-modal-title">Add customer</h2>
    <form id="customer-form">
      <input type="hidden" id="customer-id">
      <div class="form-grid">
        <div class="field full"><label>Full name</label><input class="input" id="c-name" required></div>
        <div class="field"><label>Phone</label><input class="input" id="c-phone"></div>
        <div class="field"><label>Email</label><input class="input" type="email" id="c-email"></div>
        <div class="field full"><label>Address</label><input class="input" id="c-address"></div>
        <div class="field full"><label>Notes</label><textarea class="input" id="c-notes" rows="2"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('customer-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save customer</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
