<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders · Cuts & Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">Cuts&nbsp;&amp;&nbsp;Co. <span>MEAT SHOP</span></div>
    <nav class="nav-group">
      <a class="nav-link" href="index.html">🏠 Dashboard</a>
      <a class="nav-link" href="products.html">🥩 Products</a>
      <a class="nav-link" href="inventory.html">📦 Inventory</a>
      <a class="nav-link" href="orders.html">🧾 Orders</a>
      <a class="nav-link" href="customers.html">👤 Customers</a>
      <a class="nav-link" href="settings.html">⚙️ Categories / Suppliers / Staff</a>
    </nav>
    <div class="sidebar-foot">Connected to Supabase.<br>Backend: Flask REST API.</div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>Orders</h1>
        <p>Ring up a sale and keep track of every transaction.</p>
      </div>
      <button class="btn btn-primary" onclick="openOrderModal()">+ New order</button>
    </div>

    <div class="toolbar">
      <select class="input" id="status-filter" onchange="loadOrders()">
        <option value="">All statuses</option>
        <option value="paid">Paid</option>
        <option value="pending">Pending</option>
        <option value="cancelled">Cancelled</option>
        <option value="refunded">Refunded</option>
      </select>
    </div>

    <div class="panel">
      <div class="panel-body">
        <table>
          <thead>
            <tr><th>Order #</th><th>Customer</th><th>Served by</th><th>Status</th><th>Date</th><th>Total</th></tr>
          </thead>
          <tbody id="order-rows"><tr><td colspan="6" class="cell-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- New Order Modal -->
<div class="modal-overlay" id="order-modal">
  <div class="modal" style="max-width:660px">
    <h2>New order</h2>
    <form id="order-form">
      <div class="form-grid">
        <div class="field">
          <label>Customer (optional)</label>
          <select class="input" id="o-customer"><option value="">Walk-in customer</option></select>
        </div>
        <div class="field">
          <label>Served by</label>
          <select class="input" id="o-employee"><option value="">—</option></select>
        </div>
        <div class="field">
          <label>Payment method</label>
          <select class="input" id="o-payment">
            <option value="cash">Cash</option>
            <option value="gcash">GCash</option>
            <option value="card">Card</option>
            <option value="bank_transfer">Bank transfer</option>
          </select>
        </div>
        <div class="field">
          <label>Status</label>
          <select class="input" id="o-status">
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
          </select>
        </div>
      </div>

      <div style="margin-top:16px">
        <div class="flex-between">
          <label style="font-size:12.5px;font-weight:600;color:var(--ink-soft)">Items</label>
          <button type="button" class="btn btn-ghost btn-sm" onclick="addOrderLine()">+ Add item</button>
        </div>
        <div id="order-lines" style="margin-top:8px"></div>
      </div>

      <div class="flex-between" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">
        <strong>Total</strong>
        <strong id="order-total">₱0.00</strong>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('order-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Place order</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
